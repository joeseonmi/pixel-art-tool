<style>
:root{--bg:#17181c;--panel:#22242a;--panel2:#2b2e36;--line:#3a3d47;--text:#e8e9ed;--muted:#9a9eab;--accent:#5fd4b8;--accent-ink:#0d2a24;--danger:#ff7b7b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-touch-callout:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage,#pad{touch-action:none}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:196px minmax(0,1fr) 232px;overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#5a5e6b}
button:disabled{opacity:.4;cursor:default}
button.primary,button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--accent);outline-offset:1px}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
header .grow{flex:1}
#name{width:150px}
aside{background:var(--panel);overflow-y:auto;padding:10px}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column}
h4{margin:14px 0 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
h4:first-child{margin-top:0}
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px}
.tools button{display:flex;justify-content:space-between;align-items:center;padding:6px 8px}
kbd{font:10px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
button.on kbd{color:var(--accent-ink);border-color:rgba(0,0,0,.25)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;display:flex;align-items:center;gap:6px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px}
#color{width:44px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
#hex{width:84px;font-family:ui-monospace,Menlo,monospace}
#palette{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
#palette i{aspect-ratio:1;border-radius:3px;border:1px solid rgba(255,255,255,.15);cursor:pointer}
#palette i.cur{outline:2px solid var(--text);outline-offset:1px}
#stage{position:relative;overflow:auto;display:flex;background:var(--bg)}
#view{margin:auto;flex:none;image-rendering:pixelated;cursor:crosshair;touch-action:none;box-shadow:0 0 0 1px var(--line),0 8px 30px rgba(0,0,0,.5);background:repeating-conic-gradient(#c9cbd1 0 25%,#f1f2f4 0 50%) 0 0/16px 16px}
#pad{padding:64px;margin:auto;display:flex;position:relative}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#stage.pan #view{cursor:grab}
#stage.drop::after{content:"여기에 놓으면 새 레이어(또는 프레임)로 합쳐져요";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(23,24,28,.8);pointer-events:none}
#pvbox{display:flex;align-items:center;justify-content:center;height:150px;border-radius:8px;background:repeating-conic-gradient(#c9cbd1 0 25%,#f1f2f4 0 50%) 0 0/12px 12px;overflow:hidden;flex:none}
#pv{image-rendering:pixelated}
#layers{flex:1;overflow-y:auto;margin:0 -4px;min-height:80px}
.layer{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.layer:hover{background:var(--panel2)}
.layer.active{background:var(--panel2);border-color:var(--accent)}
.layer .eye{width:24px;height:24px;padding:0;border-radius:50%;font-size:11px;flex:none}
.layer.off .lname,.layer.off .thumb{opacity:.4}
.thumb{width:34px;height:34px;flex:none;image-rendering:pixelated;border-radius:3px;background:repeating-conic-gradient(#c9cbd1 0 25%,#f1f2f4 0 50%) 0 0/8px 8px}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname input{width:100%}
.lop{color:var(--muted);font-size:11px}

/* 타임라인 */
#timeline{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:200px;min-height:0}
.tlbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.tlbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.tlbar input[type=number]{width:66px;padding:4px 6px}
.tlbar select{padding:4px 6px;max-width:160px}
.tlbar button{padding:4px 8px}
.tlbar label{display:flex;align-items:center;gap:4px;color:var(--muted)}
#fInfo{min-width:82px;text-align:center;font-variant-numeric:tabular-nums}
#bPlay{min-width:64px}
#tlwrap{overflow:auto;flex:1;min-height:0;position:relative}
#tlgrid{display:grid;width:max-content;padding:0 10px 8px 0;grid-auto-rows:min-content}
.tl-name{position:sticky;left:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;width:160px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:12px;border-right:1px solid var(--line)}
.tl-name.lrow{cursor:pointer;color:var(--text)}
.tl-name.lrow.act{color:var(--accent);font-weight:600}
.tl-name.lrow.off span{opacity:.4}
.tl-name .teye{width:20px;height:20px;padding:0;border-radius:50%;font-size:10px;flex:none}
.tl-name span{overflow:hidden;text-overflow:ellipsis}
.tl-tag{height:18px;margin:3px 1px 1px;border-radius:4px;padding:0 6px;font-size:11px;line-height:18px;color:#101114;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.tl-tag.loop{box-shadow:0 0 0 2px var(--text)}
.tl-fh{width:34px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;border-radius:5px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-fh canvas{width:26px;height:26px;image-rendering:pixelated;border-radius:3px;background:repeating-conic-gradient(#c9cbd1 0 25%,#f1f2f4 0 50%) 0 0/6px 6px}
.tl-fh b{color:var(--text);font-weight:500;font-size:11px}
.tl-fh.insel{background:rgba(95,212,184,.16)}
.tl-fh.cur{background:var(--accent);color:var(--accent-ink)}
.tl-fh.cur b{color:var(--accent-ink);font-weight:700}
.tl-cel{width:34px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-bottom:1px solid #2f323a;color:#6c7080;font-size:11px}
.tl-cel.full{color:var(--text)}
.tl-cel.cur{background:rgba(95,212,184,.12)}
.tl-cel.act{background:rgba(255,255,255,.04)}
.tl-cel.cur.act{background:rgba(95,212,184,.35);color:#fff}

footer{grid-column:1/-1;display:flex;gap:14px;align-items:center;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer button{padding:2px 8px}
#zoomv{min-width:48px;text-align:center;color:var(--text)}
#back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10}
#dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:300px;max-width:480px;user-select:text;-webkit-user-select:text}
#dlg h3{margin:0 0 10px;font-size:15px}
#dlg .mbody{color:var(--text);line-height:1.6}
#dlg .mbody input[type=number]{width:80px}
#dlg .mbody input[type=text]{width:100%}
#dlg .mbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:16px}
#dlg .mbtns .left{margin-right:auto;color:var(--danger)}
#dlg table{border-collapse:collapse;width:100%}
#dlg td{padding:2px 8px 2px 0;vertical-align:top}
#dlg td:first-child{color:var(--muted);white-space:nowrap}
#dlg .note{color:var(--muted);font-size:12px;margin-top:6px}
/* 파일 메뉴 */
.menuwrap{position:relative}
#fileMenu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:250px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column}
#fileMenu button{display:flex;justify-content:space-between;gap:18px;background:none;border:0;border-radius:6px;padding:7px 10px;text-align:left}
#fileMenu button:hover,#fileMenu button:focus-visible{background:var(--panel2);outline:none}
#fileMenu button kbd{border:0;font-size:11px}
#fileMenu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#fileMenu .mh{font-size:11px;color:var(--muted);padding:4px 10px 2px}
#bFile.open{border-color:var(--accent)}
#bAnim.on{background:var(--accent);color:var(--accent-ink)}
/* 마네킹 */
.bases{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:52vh;overflow:auto;margin:4px 0}
.base{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:var(--panel2)}
.base.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.base canvas{max-width:100%;max-height:96px;object-fit:contain;image-rendering:pixelated;border-radius:6px;background:repeating-conic-gradient(#c9cbd1 0 25%,#f1f2f4 0 50%) 0 0/10px 10px}
.base .bn{font-size:12px;text-align:center}
.base .bs{font-size:11px;color:var(--muted)}
.base .bdel{font-size:11px;padding:1px 6px;color:var(--danger)}
.base .bdel.sure{background:var(--danger);border-color:var(--danger);color:#2a0d0d;font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
#dlg.wide{max-width:640px;width:92vw}
/* 격자 설정 */
#gridPop{position:fixed;right:10px;bottom:40px;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:290px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
#gridPop h5{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
#gridPop input[type=number]{width:62px}
#gridPop .seg{display:flex;gap:4px}
#gridPop .seg button{flex:1;padding:5px 4px}
#bGrid.on{background:var(--panel2);border-color:var(--accent);color:var(--accent);font-weight:600}
/* 변형 패널 */
#xfPanel{border:1px solid var(--accent);border-radius:8px;padding:8px;margin-top:10px;background:rgba(95,212,184,.06)}
#xfPanel .row{margin:5px 0}
#xfPanel input[type=number]{width:58px;padding:4px 5px}
#xfPanel .row>span:first-child{width:40px;flex:none;color:var(--muted);white-space:nowrap}
#xfPanel #xKx,#xfPanel #xKy{width:50px}
#xfPanel .btns button{padding:4px 6px}
/* 내 작업 */
#bCloud.pending{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#bCloud.warn,#bWorks.warn{border-color:var(--danger);color:var(--danger)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;max-height:44vh;overflow:auto;margin:10px 0}
.work{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.work:hover{border-color:#5a5e6b}
.work.cur{border-color:var(--accent)}
.wthumb{height:96px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#c9cbd1 0 25%,#f1f2f4 0 50%) 0 0/10px 10px;overflow:hidden}
.wthumb img{image-rendering:pixelated;max-width:100%;max-height:100%}
.wname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wname input{width:100%}
.wmeta{font-size:11px;color:var(--muted)}
.wbtns{display:flex;gap:4px}
.wbtns button{flex:1;padding:2px 4px;font-size:11px}
.wbtns .wdel{color:var(--danger)}
.wbtns .wdel.sure{background:var(--danger);color:#2a0d0d;font-weight:600;flex:2}
.ghbox{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.ghrow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.gherr{color:var(--danger);font-size:12px;margin:6px 0}
.ghbox details summary{cursor:pointer;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;border-radius:8px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
#toast.show{opacity:.92}
</style>
</head>
<body>
<header>
  <div class="menuwrap">
    <button id="bFile" aria-haspopup="true" aria-expanded="false">파일 ▾</button>
    <div id="fileMenu" role="menu" hidden>
      <button data-act="works">내 작업…</button>
      <hr>
      <button data-act="new">새로 만들기</button>
      <button data-act="open">파일 열기 (.pxproj, 그림)…<kbd>⌘O</kbd></button>
      <button data-act="save">파일로 저장 (.pxproj)</button>
      <button data-act="saveas">다른 이름으로 파일 저장…<kbd>⇧⌘S</kbd></button>
      <hr>
      <button data-act="import">불러와 합치기…</button>
      <button data-act="bases">마네킹 꺼내기…<kbd>⇧B</kbd></button>
      <button data-act="addbase">지금 그림을 마네킹으로 등록</button>
      <hr>
      <div class="mh">내보내기</div>
      <button data-act="png">PNG…</button>
      <button data-act="slice">나눠서 저장 (맵 조각)…</button>
      <button data-act="gif" class="animonly">GIF…</button>
      <button data-act="sheet" class="animonly">스프라이트시트 (Godot)…</button>
    </div>
  </div>
  <button id="bWorks" title="이 기기에 저장된 작업 목록 · GitHub 동기화">내 작업</button>
  <button id="bCloud" title="GitHub에 올리고 다른 기기 것 받기 (⌘S)">☁ 저장</button>
  <button id="bAnim" title="애니메이션 타임라인 켜기/끄기 (⇧T)">애니메이션</button>
  <span class="sep"></span>
  <button id="bUndo" title="실행취소 (⌘Z)">↶ 취소</button>
  <button id="bRedo" title="다시실행 (⇧⌘Z)">↷ 다시</button>
  <button id="bResize">캔버스 크기</button>
  <button id="bCrop" title="여백을 잘라내거나 선택 영역만 남기기">자르기</button>
  <span class="grow"></span>
  <input id="name" type="text" placeholder="파일 이름" title="저장할 때 쓰는 이름">
  <button id="bHelp">단축키</button>
</header>

<aside id="left">
  <h4>도구</h4>
  <div class="tools" id="tools"></div>
  <h4>옵션</h4>
  <div class="row"><span>굵기</span><input id="brush" type="range" min="1" max="16" value="1"><span id="brushv">1</span></div>
  <div class="row"><label title="굵기가 4면 그림을 4×4 칸으로 나눠서, 커서가 있는 칸 하나를 통째로 칠해요"><input id="snapBrush" type="checkbox">굵기만큼 칸에 맞추기</label></div>

<script>
'use strict';
const APP_VERSION='2026-10-27.13';
const $=s=>document.querySelector(s);
const MAX=1024, AUTOSAVE='pixelart-tool-anim-autosave', OLD_AUTOSAVE='pixelart-tool-autosave';
const TOOLS=[
 ['pencil','연필','B','KeyB','끌어서 점을 찍어요. 우클릭하면 그 자리 색을 가져와요.'],
 ['eraser','지우개','E','KeyE','끌어서 지워요.'],
 ['fill','페인트통','G','KeyG','이어진 같은 색 영역을 채워요.'],
 ['picker','스포이드','I','KeyI','클릭한 곳의 색을 가져와요.'],
 ['line','선','L','KeyL','끌어서 직선을 그려요.'],
 ['rect','사각형','R','KeyR','끌어서 사각형. Shift를 누르면 정사각형.'],
 ['ellipse','원','O','KeyO','끌어서 원/타원. Shift를 누르면 정원.'],
 ['select','선택','M','KeyM','끌어서 영역 선택. 선택 안쪽을 끌면 옮겨져요. Esc로 해제.'],
 ['move','이동','V','KeyV','선택 영역(없으면 레이어 전체)을 끌어서 옮겨요. 방향키는 1칸씩.'],
 ['transform','변형','T','KeyT','선택 영역(없으면 레이어의 그림 전체)을 회전·크기·기울기 변형. Enter 적용, Esc 취소.']
];
const DEFAULT_PAL=['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'];
const TAG_COLORS=['#ff8a80','#ffd166','#9be564','#5fd4b8','#74b9ff','#c792ea','#ff9ecd','#f6a96b'];
const DIRS={forward:'앞으로',reverse:'거꾸로',pingpong:'왕복'};
const DEFAULT_DUR=100;

let doc=null, uid=1;
let tool='pencil', color='#1d2b53', brush=1, fillShape=false, mirror=false, zoom=16, autoXf=true, snapBrush=false;
let grid={pixel:true,tile:'none',w:16,h:16,x:0,y:0,color:'#5fd4b8',alpha:60,last:'square'};
let xf=null, xfDrag=null;
let sel=null, palette=[...DEFAULT_PAL], clip=null;
let hist=[], hi=-1, dirty=false, fileHandle=null, modalOpen=false;
let drag=null, hover=null, spaceDown=false, pan=null, B=null, erasing=false;
let fsel={a:0,b:0};             // 선택한 프레임 범위
let loopTag=-1;                 // 재생 범위: -1 = 전체, 아니면 태그 번호
let onion={on:false,prev:1,next:1,tint:true};
let playing=null;               // {seq, i, t}
let animOn=false, exportScale=1;

const view=$('#view'), vctx=view.getContext('2d'), stage=$('#stage'), pad=$('#pad'), ov=$('#ov'), ovx=ov.getContext('2d');

/* ---------- 기본 ---------- */
function capture(el,e){try{el.setPointerCapture(e.pointerId)}catch(err){}}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function mkCel(w,h){const canvas=mkCanvas(w,h);return{canvas,ctx:canvas.getContext('2d',{willReadFrequently:true}),snap:null,empty:null}}
// 레이어는 프레임마다 cel(그림 한 장)을 가지고, layer.canvas / layer.ctx 는 지금 프레임의 cel 을 가리켜요.
function mkLayer(name,w,h,n){
  if(n==null)n=doc?doc.frames.length:1;
  const l={id:uid++,name,visible:true,opacity:1,cels:[]};
  for(let i=0;i<n;i++)l.cels.push(mkCel(w,h));
  Object.defineProperties(l,{canvas:{get(){return this.cels[doc.frame].canvas}},ctx:{get(){return this.cels[doc.frame].ctx}}});
  return l;
}
function clampSize(v){v=Math.round(+v)||1;return Math.max(1,Math.min(MAX,v))}
function active(){return doc.layers[doc.active]}
function touchCel(c){c.snap=null;c.empty=null}
function touch(l){touchCel(l.cels[doc.frame])}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function celData(c){return c.snap||(c.snap=c.ctx.getImageData(0,0,doc.w,doc.h))}
function celEmpty(c){
  if(c.empty==null){const d=celData(c).data;let e=true;for(let i=3;i<d.length;i+=4)if(d[i]){e=false;break}c.empty=e}
  return c.empty;
}
function nF(){return doc.frames.length}
function fLo(){return Math.min(fsel.a,fsel.b)}
function fHi(){return Math.max(fsel.a,fsel.b)}

function modal(title,body,buttons,opts){
  return new Promise(res=>{
    const dlg=$('#dlg');dlg.className=opts&&opts.wide?'wide':'';
    dlg.innerHTML=`<h3>${title}</h3><div class="mbody">${body}</div><div class="mbtns"></div>`;
    const done=v=>{$('#back').hidden=true;modalOpen=false;window.removeEventListener('keydown',onEsc,true);res(v)};
    const onEsc=e=>{if(e.key==='Escape'&&!dlg.contains(e.target)){e.preventDefault();done(null)}};
    window.addEventListener('keydown',onEsc,true);
    buttons.forEach(b=>{const el=document.createElement('button');el.textContent=b.label;if(b.primary)el.className='primary';if(b.left)el.className='left';el.onclick=()=>done(b.value);dlg.querySelector('.mbtns').append(el)});
    $('#back').hidden=false;modalOpen=true;
    const first=dlg.querySelector('input[type=text],input[type=number]');
    if(first){first.focus();first.select&&first.select()}else dlg.querySelector('.mbtns button:last-child').focus();
    dlg.onkeydown=e=>{
      if(e.key==='Enter'&&!e.isComposing&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='SELECT'){const p=buttons.find(b=>b.primary);if(p){e.preventDefault();done(p.value)}}
      if(e.key==='Escape')done(null);
    };
  });
}

/* ---------- 실행취소 기록 ---------- */
function snapshot(){
  return{w:doc.w,h:doc.h,active:doc.active,frame:doc.frame,frames:doc.frames.map(f=>({...f})),tags:doc.tags.map(t=>({...t})),
    layers:doc.layers.map(l=>({id:l.id,name:l.name,visible:l.visible,opacity:l.opacity,base:!!l.base,cels:l.cels.map(celData)}))};
}
function commit(){
  if(xf&&!xf.applying){xf=null;showXfPanel()}
  hist.length=hi+1;hist.push(snapshot());
  if(hist.length>80)hist.shift();
  hi=hist.length-1;dirty=true;scheduleAutosave();refreshAll();
}
function resetHistory(){hist=[snapshot()];hi=0;dirty=false;refreshAll()}
function restore(s){
  stopPlay();
  doc.w=s.w;doc.h=s.h;doc.frames=s.frames.map(f=>({...f}));doc.tags=s.tags.map(t=>({...t}));
  doc.frame=Math.min(s.frame,doc.frames.length-1);
  doc.layers=s.layers.map(d=>{const l=mkLayer(d.name,s.w,s.h,0);l.id=d.id;l.visible=d.visible;l.opacity=d.opacity;if(d.base)l.base=true;
    l.cels=d.cels.map(data=>{const c=mkCel(s.w,s.h);c.ctx.putImageData(data,0,0);c.snap=data;return c});return l});
  doc.active=Math.min(s.active,doc.layers.length-1);sel=null;fixFsel();fixLoopTag();dirty=true;scheduleAutosave();refreshAll();
}
function undo(){if(xf){cancelXf();return}if(hi>0)restore(hist[--hi])}
function redo(){if(xf){cancelXf();return}if(hi<hist.length-1)restore(hist[++hi])}

/* ---------- 화면 그리기 ---------- */
let raf=0;
const onionC=mkCanvas(1,1),onionX=onionC.getContext('2d');
function render(){if(doc&&!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
function drawFrameTo(ctx,f,W,H){
  for(const l of doc.layers){if(!l.visible)continue;ctx.globalAlpha=l.opacity;ctx.drawImage(l.cels[f].canvas,0,0,W,H)}
  ctx.globalAlpha=1;
}
function drawOnion(W,H){
  if(onionC.width!==doc.w||onionC.height!==doc.h){onionC.width=doc.w;onionC.height=doc.h}
  const list=[];
  for(let k=onion.prev;k>=1;k--)if(doc.frame-k>=0)list.push([doc.frame-k,k,'rgb(255,70,70)']);
  for(let k=onion.next;k>=1;k--)if(doc.frame+k<nF())list.push([doc.frame+k,k,'rgb(60,130,255)']);
  vctx.imageSmoothingEnabled=false;
  for(const[f,k,tint]of list){
    onionX.globalCompositeOperation='source-over';onionX.clearRect(0,0,doc.w,doc.h);
    drawFrameTo(onionX,f,doc.w,doc.h);
    if(onion.tint){onionX.globalCompositeOperation='source-atop';onionX.globalAlpha=.55;onionX.fillStyle=tint;onionX.fillRect(0,0,doc.w,doc.h);onionX.globalAlpha=1;onionX.globalCompositeOperation='source-over'}
    vctx.globalAlpha=Math.max(.12,.42-(k-1)*.12);vctx.drawImage(onionC,0,0,W,H);
  }
  vctx.globalAlpha=1;
}
function draw(){
  const z=zoom,W=doc.w*z,H=doc.h*z;
  if(view.width!==W||view.height!==H){view.width=W;view.height=H;view.style.width=W+'px';view.style.height=H+'px'}
  vctx.clearRect(0,0,W,H);vctx.imageSmoothingEnabled=false;
  if(animOn&&onion.on&&!playing)drawOnion(W,H);
  drawFrameTo(vctx,doc.frame,W,H);
  if(grid.pixel&&z>=6){
    vctx.beginPath();
    for(let x=1;x<doc.w;x++){vctx.moveTo(x*z+.5,0);vctx.lineTo(x*z+.5,H)}
    for(let y=1;y<doc.h;y++){vctx.moveTo(0,y*z+.5);vctx.lineTo(W,y*z+.5)}
    vctx.strokeStyle='rgba(90,90,100,.28)';vctx.lineWidth=1;vctx.stroke();
  }
  if(snapBrush&&brush>1&&brush*z>=6){
    vctx.beginPath();
    for(let x=brush;x<doc.w;x+=brush){vctx.moveTo(x*z+.5,0);vctx.lineTo(x*z+.5,H)}
    for(let y=brush;y<doc.h;y+=brush){vctx.moveTo(0,y*z+.5);vctx.lineTo(W,y*z+.5)}
    vctx.strokeStyle='rgba(60,60,72,.45)';vctx.lineWidth=1;vctx.stroke();
  }
  if(grid.tile!=='none')drawTileGrid(W,H,z);
  if(mirror){vctx.fillStyle='rgba(95,212,184,.7)';vctx.fillRect(W/2-1,0,2,H)}
  if(sel){
    const r=[sel.x*z+.5,sel.y*z+.5,sel.w*z-1,sel.h*z-1];
    vctx.lineWidth=1;vctx.setLineDash([]);vctx.strokeStyle='#fff';vctx.strokeRect(...r);
    vctx.setLineDash([4,4]);vctx.strokeStyle='#000';vctx.strokeRect(...r);vctx.setLineDash([]);
  }
  drawOverlay();
  if(hover&&!drag&&!playing&&!xf){
    const useB=(tool==='pencil'||tool==='eraser'||tool==='line'||(!fillShape&&(tool==='rect'||tool==='ellipse'))),n=useB?brush:1,bo=useB?brushOrigin(hover.x,hover.y):hover;
    vctx.lineWidth=1;vctx.strokeStyle='rgba(0,0,0,.8)';vctx.strokeRect(bo.x*z+.5,bo.y*z+.5,n*z-1,n*z-1);
    vctx.strokeStyle='rgba(255,255,255,.9)';vctx.strokeRect(bo.x*z+1.5,bo.y*z+1.5,n*z-3,n*z-3);
  }
  if(!pvPlaying())drawPreview(doc.frame);
}
function refreshAll(){
  refreshLayers();refreshTimeline();render();if(pvPlaying()&&!pvTimer)pvTick();
  $('#bUndo').disabled=hi<=0;$('#bRedo').disabled=hi>=hist.length-1;
  $('#size').textContent=doc.w+' × '+doc.h;
  $('#zoomv').textContent=zoom*100+'%';
  updateSavedUI();
  document.title=(doc.name||'제목없음')+' – 픽셀아트툴';
}
function refreshLayers(){
  const box=$('#layers');box.innerHTML='';
  for(let i=doc.layers.length-1;i>=0;i--){
    const l=doc.layers[i],row=document.createElement('div');
    row.className='layer'+(i===doc.active?' active':'')+(l.visible?'':' off');row.dataset.i=i;
    row.innerHTML=`<button class="eye" title="보이기/숨기기">${l.visible?'●':'○'}</button><canvas class="thumb" width="34" height="34"></canvas><span class="lname" title="두 번 클릭하면 이름 변경">${esc(l.name)}</span><span class="lop">${l.opacity<1?Math.round(l.opacity*100)+'%':''}</span>`;
    const t=row.querySelector('.thumb').getContext('2d'),s=Math.min(34/doc.w,34/doc.h);
    t.imageSmoothingEnabled=false;t.drawImage(l.canvas,(34-doc.w*s)/2,(34-doc.h*s)/2,doc.w*s,doc.h*s);
    box.append(row);
  }
  const l=active();$('#opacity').value=Math.round(l.opacity*100);$('#opv').textContent=Math.round(l.opacity*100);
  $('#bDel').disabled=doc.layers.length<2;$('#bMerge').disabled=doc.active<1;
  $('#bUp').disabled=doc.active>=doc.layers.length-1;$('#bDown').disabled=doc.active<1;
}
function setActive(i){
  if(xf)applyXf();
  doc.active=i;
  document.querySelectorAll('.layer').forEach(r=>r.classList.toggle('active',+r.dataset.i===i));
  const l=active();$('#opacity').value=Math.round(l.opacity*100);$('#opv').textContent=Math.round(l.opacity*100);
  $('#bMerge').disabled=i<1;$('#bUp').disabled=i>=doc.layers.length-1;$('#bDown').disabled=i<1;
  markTimeline();
}
function setZoom(z,cx,cy){
  z=Math.max(1,Math.min(64,Math.round(z)));
  while(z>1&&Math.max(doc.w,doc.h)*z>8192)z--;
  if(z===zoom)return;
  const r=view.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  if(cx==null){cx=sr.left+sr.width/2;cy=sr.top+sr.height/2}
  const px=(cx-r.left)/zoom,py=(cy-r.top)/zoom;
  zoom=z;draw();refreshAll();
  const r2=view.getBoundingClientRect();
  stage.scrollLeft+=r2.left+px*z-cx;stage.scrollTop+=r2.top+py*z-cy;
}
function fitZoom(){
  const z=Math.floor(Math.min((stage.clientWidth-110)/doc.w,(stage.clientHeight-110)/doc.h));
  let n=Math.max(1,Math.min(64,z));
  while(n>1&&Math.max(doc.w,doc.h)*n>8192)n--;
  zoom=n;draw();refreshAll();stage.scrollLeft=stage.scrollTop=0;
}

/* ---------- 미리보기 ---------- */
const pv=$('#pv'),pvx=pv.getContext('2d');
let pvTimer=0,pvSeqI=0;
function pvPlaying(){return animOn&&$('#pvPlay').checked&&nF()>1}
function drawPreview(f){
  const box=$('#pvbox'),bw=box.clientWidth-8||200,bh=box.clientHeight-8||140,zsel=+$('#pvZoom').value;
  let s=zsel||Math.max(1,Math.floor(Math.min(bw/doc.w,bh/doc.h)));
  if(!zsel&&Math.min(bw/doc.w,bh/doc.h)<1)s=Math.min(bw/doc.w,bh/doc.h);
  const W=Math.max(1,Math.round(doc.w*s)),H=Math.max(1,Math.round(doc.h*s));
  if(pv.width!==W||pv.height!==H){pv.width=W;pv.height=H}
  pvx.clearRect(0,0,W,H);pvx.imageSmoothingEnabled=false;drawFrameTo(pvx,f,W,H);
}
function pvTick(){
  clearTimeout(pvTimer);
  if(!doc)return;
  if(!pvPlaying()){pvTimer=0;drawPreview(doc.frame);return}
  const seq=playSeq();pvSeqI=pvSeqI%seq.length;
  const f=seq[pvSeqI];drawPreview(f);pvSeqI++;
  pvTimer=setTimeout(pvTick,doc.frames[f].duration);
}

/* ---------- 재생 ---------- */
function seqFor(from,to,dir){
  const s=[];for(let i=from;i<=to;i++)s.push(i);
  if(dir==='reverse')s.reverse();
  if(dir==='pingpong')for(let i=to-1;i>from;i--)s.push(i);
  return s;
}
function playSeq(){
  const t=doc.tags[loopTag];
  return t?seqFor(t.from,t.to,t.direction):seqFor(0,nF()-1,'forward');
}
function startPlay(){
  if(nF()<2){toast('프레임이 2장 이상이어야 재생할 수 있어요');return}
  if(drag)return;
  const seq=playSeq();let i=seq.indexOf(doc.frame);if(i<0)i=0;
  playing={seq,i};
  $('#bPlay').textContent='⏸ 멈춤';
  stepPlay();
}
function stepPlay(){
  if(!playing)return;
  const f=playing.seq[playing.i];
  doc.frame=f;fsel={a:f,b:f};markTimeline();render();
  playing.i=(playing.i+1)%playing.seq.length;
  playing.t=setTimeout(stepPlay,doc.frames[f].duration);
}
function stopPlay(){
  if(!playing)return;
  clearTimeout(playing.t);playing=null;$('#bPlay').textContent='▶ 재생';
  refreshLayers();refreshTimeline();render();
}
function togglePlay(){playing?stopPlay():startPlay()}

/* ---------- 프레임 ---------- */
function gotoFrame(f,keepSel){
  stopPlay();if(xf)applyXf();
  f=Math.max(0,Math.min(nF()-1,f));
  doc.frame=f;if(!keepSel)fsel={a:f,b:f};
  if(drag)return;
  refreshLayers();markTimeline();render();
}
function fixFsel(){const n=nF()-1;fsel={a:Math.min(fsel.a,n),b:Math.min(fsel.b,n)};if(doc.frame<fLo()||doc.frame>fHi())fsel={a:doc.frame,b:doc.frame}}
function fixLoopTag(){if(loopTag>=doc.tags.length)loopTag=-1}
function ensureFrames(n){
  while(nF()<n){doc.frames.push({duration:doc.frames[nF()-1].duration});for(const l of doc.layers)l.cels.push(mkCel(doc.w,doc.h))}
}
function insertFrame(at,copyFrom){
  const dur=doc.frames[Math.max(0,Math.min(nF()-1,copyFrom>=0?copyFrom:doc.frame))].duration;
  for(const t of doc.tags){
    if(at<=t.from){t.from++;t.to++}
    else if(at<=t.to)t.to++;
    else if(at===t.to+1&&doc.frame>=t.from&&doc.frame<=t.to)t.to++;
  }
  doc.frames.splice(at,0,{duration:dur});
  for(const l of doc.layers){const c=mkCel(doc.w,doc.h);if(copyFrom>=0)c.ctx.drawImage(l.cels[copyFrom].canvas,0,0);l.cels.splice(at,0,c)}
}
function addFrame(copy){
  stopPlay();
  const at=doc.frame+1;insertFrame(at,copy?doc.frame:-1);
  doc.frame=at;fsel={a:at,b:at};commit();
}
function deleteFrames(){
  stopPlay();
  const a=fLo(),b=fHi(),n=b-a+1;
  if(n>=nF()){toast('프레임은 최소 1장 있어야 해요');return}
  doc.frames.splice(a,n);for(const l of doc.layers)l.cels.splice(a,n);
  doc.tags=doc.tags.filter(t=>{
    const keepFrom=t.from<a?t.from:(t.from>b?t.from-n:a);
    const keepTo=t.to<a?t.to:(t.to>b?t.to-n:a-1);
    t.from=keepFrom;t.to=keepTo;return t.to>=t.from;
  });
  fixLoopTag();
  doc.frame=Math.min(a,nF()-1);fsel={a:doc.frame,b:doc.frame};commit();
}
function moveFrames(d){
  stopPlay();
  const a=fLo(),b=fHi();
  if(a+d<0||b+d>=nF())return;
  const mv=arr=>{const part=arr.splice(a,b-a+1);arr.splice(a+d,0,...part)};
  mv(doc.frames);for(const l of doc.layers)mv(l.cels);
  fsel={a:a+d,b:b+d};doc.frame+=d;commit();
}
function setDuration(ms){
  ms=Math.max(10,Math.min(10000,Math.round(+ms)||DEFAULT_DUR));
  for(let i=fLo();i<=fHi();i++)doc.frames[i].duration=ms;
  commit();
}

/* ---------- 타임라인 ---------- */
function tagLanes(){
  const lanes=[],at=[];
  doc.tags.forEach((t,i)=>{let k=0;while(lanes[k]&&lanes[k].some(j=>!(doc.tags[j].to<t.from||doc.tags[j].from>t.to)))k++;(lanes[k]=lanes[k]||[]).push(i);at[i]=k});
  return{n:lanes.length,at};
}
function refreshTimeline(){
  const g=$('#tlgrid'),N=nF(),L=doc.layers.length,{n:lanes,at}=tagLanes();
  g.style.gridTemplateColumns=`160px repeat(${N},34px)`;
  let h='';
  const tagRows=Math.max(1,lanes);
  for(let k=0;k<tagRows;k++)h+=`<div class="tl-name" style="grid-row:${k+1};grid-column:1">${k===0?(doc.tags.length?'태그':'태그 없음'):''}</div>`;
  doc.tags.forEach((t,i)=>{
    h+=`<div class="tl-tag${i===loopTag?' loop':''}" data-tag="${i}" style="grid-row:${at[i]+1};grid-column:${t.from+2}/${t.to+3};background:${t.color}" title="${esc(t.name)} · ${DIRS[t.direction]||''} · 클릭: 이 범위만 재생 / 두 번 클릭: 고치기">${esc(t.name)}</div>`;
  });
  const hr=tagRows+1;
  h+=`<div class="tl-name" style="grid-row:${hr};grid-column:1">프레임 <span style="margin-left:auto">ms</span></div>`;
  for(let f=0;f<N;f++)h+=`<div class="tl-fh" data-f="${f}" style="grid-row:${hr};grid-column:${f+2}" title="프레임 ${f+1} · ${doc.frames[f].duration}ms · Shift+클릭으로 범위 선택 · 두 번 클릭으로 시간 바꾸기"><canvas width="26" height="26"></canvas><b>${f+1}</b><span>${doc.frames[f].duration}</span></div>`;
  for(let r=0;r<L;r++){
    const li=L-1-r,l=doc.layers[li],row=hr+1+r;
    h+=`<div class="tl-name lrow${l.visible?'':' off'}" data-l="${li}" style="grid-row:${row};grid-column:1"><button class="teye" title="보이기/숨기기">${l.visible?'●':'○'}</button><span>${esc(l.name)}</span></div>`;
    for(let f=0;f<N;f++)h+=`<div class="tl-cel${celEmpty(l.cels[f])?'':' full'}" data-l="${li}" data-f="${f}" style="grid-row:${row};grid-column:${f+2}">${celEmpty(l.cels[f])?'○':'●'}</div>`;
  }
  g.innerHTML=h;
  g.querySelectorAll('.tl-fh canvas').forEach((c,f)=>{
    const x=c.getContext('2d'),s=Math.min(26/doc.w,26/doc.h),w=doc.w*s,hh=doc.h*s;
    x.imageSmoothingEnabled=false;x.save();x.translate((26-w)/2,(26-hh)/2);drawFrameTo(x,f,w,hh);x.restore();
  });
  // 재생 범위 목록
  const ls=$('#loopSel');
  ls.innerHTML=`<option value="-1">전체 프레임 재생</option>`+doc.tags.map((t,i)=>`<option value="${i}">태그: ${esc(t.name)}</option>`).join('');
  ls.value=String(loopTag);
  $('#bFDel').disabled=fHi()-fLo()+1>=N;
  markTimeline();
}
function markTimeline(){
  const g=$('#tlgrid'),f=doc.frame,a=fLo(),b=fHi();
  g.querySelectorAll('.tl-fh').forEach(el=>{const i=+el.dataset.f;el.classList.toggle('cur',i===f);el.classList.toggle('insel',i>=a&&i<=b)});
  g.querySelectorAll('.tl-cel').forEach(el=>{el.classList.toggle('cur',+el.dataset.f===f);el.classList.toggle('act',+el.dataset.l===doc.active)});
  g.querySelectorAll('.tl-name.lrow').forEach(el=>el.classList.toggle('act',+el.dataset.l===doc.active));
  $('#fInfo').textContent=`프레임 ${f+1} / ${nF()}`;
  if(document.activeElement!==$('#fDur'))$('#fDur').value=doc.frames[f].duration;
  $('#bFLeft').disabled=a<=0;$('#bFRight').disabled=b>=nF()-1;
  // 지금 프레임이 보이게 스크롤
  const cur=g.querySelector('.tl-fh.cur'),wrap=$('#tlwrap');
  if(cur){const l=cur.offsetLeft-160,r=cur.offsetLeft+cur.offsetWidth;if(l<wrap.scrollLeft)wrap.scrollLeft=l;else if(r>wrap.scrollLeft+wrap.clientWidth)wrap.scrollLeft=r-wrap.clientWidth}
}
$('#tlgrid').addEventListener('click',e=>{
  if(modalOpen)return;
  const tag=e.target.closest('.tl-tag');
  if(tag){const i=+tag.dataset.tag,t=doc.tags[i];loopTag=i;fsel={a:t.from,b:t.to};gotoFrame(t.from,true);refreshTimeline();return}
  const fh=e.target.closest('.tl-fh');
  if(fh){const f=+fh.dataset.f;if(e.shiftKey){fsel.b=f;gotoFrame(f,true)}else gotoFrame(f);return}

});
$('#tlgrid').addEventListener('dblclick',async e=>{

      <div class="note">100ms = 초당 10장, 83ms ≈ 12장, 66ms ≈ 15장</div>`,[{label:'취소',value:null},{label:'바꾸기',value:1,primary:true}]);

/* ---------- 타일 격자 ---------- */
function hexA(h,a){const[r,g,b]=hexRGB(h);return`rgba(${r},${g},${b},${a})`}
function drawTileGrid(W,H,z){
  const tw=grid.w,th=grid.h,ox=grid.x,oy=grid.y;
  vctx.save();vctx.beginPath();
  if(grid.tile==='square'){
    for(let x=((ox%tw)+tw)%tw;x<=doc.w;x+=tw){vctx.moveTo(x*z+.5,0);vctx.lineTo(x*z+.5,H)}
    for(let y=((oy%th)+th)%th;y<=doc.h;y+=th){vctx.moveTo(0,y*z+.5);vctx.lineTo(W,y*z+.5)}
  }else{
    // 마름모: 기울기 ±th/tw 인 두 방향의 선. 꼭짓점이 (ox,oy) 에서 시작해요.
    const m=th/tw,W1=doc.w,H1=doc.h;
    const k0=Math.floor((-oy-m*Math.abs(W1)-m*Math.abs(ox))/th)-2,k1=Math.ceil((H1-oy+m*W1+m*Math.abs(ox))/th)+2;
    for(let k=k0;k<=k1;k++){
      const a0=m*(0-ox)+oy+k*th,a1=m*(W1-ox)+oy+k*th;vctx.moveTo(0,a0*z);vctx.lineTo(W,a1*z);
      const b0=-m*(0-ox)+oy+k*th,b1=-m*(W1-ox)+oy+k*th;vctx.moveTo(0,b0*z);vctx.lineTo(W,b1*z);
    }
  }
  vctx.strokeStyle=hexA(grid.color,grid.alpha/100);vctx.lineWidth=1;vctx.stroke();vctx.restore();
}
function refreshGridUI(){
  $('#gPix').checked=grid.pixel;
  document.querySelectorAll('#gType button').forEach(b=>b.classList.toggle('on',b.dataset.v===grid.tile));
  $('#gW').value=grid.w;$('#gH').value=grid.h;$('#gX').value=grid.x;$('#gY').value=grid.y;$('#gCol').value=grid.color;$('#gA').value=grid.alpha;
  $('#bGrid').classList.toggle('on',grid.tile!=='none');
  $('#bGrid').textContent='격자'+(grid.tile==='square'?` ${grid.w}×${grid.h}`:grid.tile==='iso'?` ◇${grid.w}×${grid.h}`:'')+' ▾';
}
function gridChanged(){saveSettings();refreshGridUI();render()}
$('#bGrid').onclick=e=>{e.stopPropagation();$('#gridPop').hidden=!$('#gridPop').hidden;refreshGridUI()};
document.addEventListener('pointerdown',e=>{if(!$('#gridPop').hidden&&!e.target.closest('#gridPop')&&!e.target.closest('#bGrid'))$('#gridPop').hidden=true});
$('#gPix').onchange=e=>{grid.pixel=e.target.checked;gridChanged()};
$('#gType').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;
  if(v==='iso'&&grid.tile!=='iso'&&grid.w===grid.h){grid.w=32;grid.h=16}
  if(v==='square'&&grid.tile==='iso'&&grid.w===grid.h*2){grid.h=grid.w=16}
  grid.tile=v;if(v!=='none')grid.last=v;gridChanged()};
const gnum=(id,k,lo,hi)=>$(id).onchange=e=>{let v=Math.round(+e.target.value);if(isNaN(v))v=grid[k];grid[k]=Math.max(lo,Math.min(hi,v));gridChanged()};
gnum('#gW','w',2,512);gnum('#gH','h',2,512);gnum('#gX','x',-512,512);gnum('#gY','y',-512,512);
$('#gCol').oninput=e=>{grid.color=e.target.value;gridChanged()};$('#gA').oninput=e=>{grid.alpha=+e.target.value;gridChanged()};
$('#gridPop').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape')$('#gridPop').hidden=true});

/* ---------- 변형 (회전·크기·기울기) ---------- */
function xfMat(x){
  const r=x.angle*Math.PI/180,c=Math.cos(r),s=Math.sin(r),tx=Math.tan(x.kx*Math.PI/180),ty=Math.tan(x.ky*Math.PI/180);
  const k11=x.sx,k12=tx*x.sy,k21=ty*x.sx,k22=x.sy;
  return{a:c*k11-s*k21,b:c*k12-s*k22,d:s*k11+c*k21,e:s*k12+c*k22,cx:x.cx,cy:x.cy,hw:x.w/2,hh:x.h/2};
}
function xfPt(m,u,v){const X=u-m.hw,Y=v-m.hh;return{x:m.a*X+m.b*Y+m.cx,y:m.d*X+m.e*Y+m.cy}}
function xfCorners(){const m=xfMat(xf);return[xfPt(m,0,0),xfPt(m,xf.w,0),xfPt(m,xf.w,xf.h),xfPt(m,0,xf.h)]}
function xfLayerCel(){const l=doc.layers.find(l=>l.id===xf.lid);return l&&l.cels[xf.frame]}
function xfRender(){
  const cel=xfLayerCel();if(!cel)return;
  const out=new ImageData(new Uint8ClampedArray(xf.base.data),doc.w,doc.h),od=out.data,sd=xf.src.data,W=xf.w,Hh=xf.h;
  const m=xfMat(xf),det=m.a*m.e-m.b*m.d;
  if(Math.abs(det)>1e-6){
    const ia=m.e/det,ib=-m.b/det,id=-m.d/det,ie=m.a/det;
    const cs=xfCorners(),x0=Math.max(0,Math.floor(Math.min(...cs.map(p=>p.x)))),x1=Math.min(doc.w-1,Math.ceil(Math.max(...cs.map(p=>p.x))));

// version 2: frames / tags / layers[].cels 추가. layers[].png 는 첫 프레임 (예전 버전 호환용).
function toProject(){
  return{app:'pixel-art-tool',version:2,name:doc.name,width:doc.w,height:doc.h,palette,active:doc.active,frame:doc.frame,
    frames:doc.frames.map(f=>({duration:f.duration})),tags:doc.tags.map(t=>({name:t.name,from:t.from,to:t.to,direction:t.direction,loop:t.loop!==false,color:t.color})),

      return{name:l.name,visible:l.visible,opacity:l.opacity,...(l.base?{base:true}:{}),png:l.cels[0].canvas.toDataURL('image/png'),cels}})};

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('그림을 읽을 수 없어요'));i.src=src})}
async function parseProject(o){

  let n=Array.isArray(o.frames)&&o.frames.length?o.frames.length:1;
  for(const d of o.layers)if(Array.isArray(d.cels))n=Math.max(n,d.cels.length);
  n=Math.min(n,1000);
  const frames=[];for(let i=0;i<n;i++){const d=Array.isArray(o.frames)&&o.frames[i]&&+o.frames[i].duration;frames.push({duration:d>0?Math.max(10,Math.min(10000,Math.round(d))):DEFAULT_DUR})}
  const layers=[];
  for(const d of o.layers){
    const l=mkLayer(d.name||'레이어',w,h,n);l.visible=d.visible!==false;l.opacity=typeof d.opacity==='number'?Math.max(0,Math.min(1,d.opacity)):1;if(d.base)l.base=true;
    const srcs=Array.isArray(d.cels)?d.cels:[d.png];
    for(let f=0;f<n;f++)if(srcs[f])l.cels[f].ctx.drawImage(await loadImg(srcs[f]),0,0);
    layers.push(l);
  }
  if(!layers.length)layers.push(mkLayer('레이어 1',w,h,n));
  const tags=(Array.isArray(o.tags)?o.tags:[]).map((t,i)=>{

    return{name:String(t.name||'태그 '+(i+1)),from:a,to:b,direction:DIRS[t.direction]?t.direction:'forward',loop:t.loop!==false,color:/^#[0-9a-f]{6}$/i.test(t.color)?t.color:TAG_COLORS[i%TAG_COLORS.length]};
  });
  return{name:o.name||'제목없음',w,h,layers,frames,tags,frame:Math.max(0,Math.min(o.frame|0,n-1)),active:Math.max(0,Math.min(o.active|0,layers.length-1)),palette:Array.isArray(o.palette)?o.palette.filter(c=>/^#[0-9a-f]{6}$/i.test(c)):null};
}

/* ---------- 불러와 합치기 ---------- */
async function askFit(label,iw,ih){
  if(iw<=doc.w&&ih<=doc.h)return 1;
  const how=await modal('가져올 그림이 더 커요',`<b>${esc(label)}</b> (${iw}×${ih})이 지금 캔버스(${doc.w}×${doc.h})보다 커요. 어떻게 할까요?`,
    [{label:'취소',value:null},{label:'넘치는 부분 자르기',value:'crop'},{label:'캔버스에 맞게 줄이기',value:'shrink'},{label:'캔버스를 넓히기',value:'expand',primary:true}]);
  if(!how)return 0;
  if(how==='expand'){resizeDoc(Math.max(doc.w,iw),Math.max(doc.h,ih),0,0);return 1}
  if(how==='shrink')return Math.min(doc.w/iw,doc.h/ih);
  return 1;
}
function placeOn(ctx,canvas,iw,ih,scale){
  const dw=Math.max(1,Math.round(iw*scale)),dh=Math.max(1,Math.round(ih*scale));
  ctx.imageSmoothingEnabled=false;ctx.drawImage(canvas,Math.floor((doc.w-dw)/2),Math.floor((doc.h-dh)/2),dw,dh);
}
async function importFiles(files){
  stopPlay();
  files=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const imgs=files.filter(f=>!isProj(f)&&isImg(f));
  // 그림 여러 장 → 프레임으로 넣을지 물어보기
  if(animOn&&imgs.length>1&&imgs.length===files.length){
    const how=await modal(`그림 ${imgs.length}장을 가져와요`,`어떻게 넣을까요?<div class="note">프레임으로 넣으면 파일 이름 순서대로 지금 프레임부터 한 장씩 들어가고, 새 레이어 하나에 담겨요.</div>`,
      [{label:'취소',value:null},{label:'레이어로 합치기',value:'layers'},{label:'프레임으로 넣기',value:'frames',primary:true}]);
    if(!how)return;
    if(how==='frames'){
      const cs=[];for(const f of imgs){try{cs.push(await fileToCanvas(f))}catch(err){toast(f.name+': '+err.message)}}
      if(!cs.length)return;
      const iw=Math.max(...cs.map(c=>c.width)),ih=Math.max(...cs.map(c=>c.height));
      const scale=await askFit(imgs.length+'장',iw,ih);if(!scale)return;
      const start=doc.frame;ensureFrames(start+cs.length);
      const l=mkLayer(baseName(imgs[0].name).replace(/[_\- ]?\d+$/,'')||'가져온 프레임',doc.w,doc.h);
      cs.forEach((c,i)=>{placeOn(l.cels[start+i].ctx,c,c.width,c.height,scale);touchCel(l.cels[start+i])});
      doc.layers.splice(doc.active+1,0,l);doc.active++;sel=null;fsel={a:start,b:start+cs.length-1};commit();fitZoom();
      toast(`프레임 ${start+1}~${start+cs.length} 에 넣었어요`);return;
    }
  }
  let added=0;
  for(const file of files){
    try{
      if(isProj(file)){
        const d=await parseProject(JSON.parse(await file.text()));
        added+=await mergeProject(d,baseName(file.name));
      }
      else if(isImg(file)){
        const c=await fileToCanvas(file),scale=await askFit(file.name,c.width,c.height);if(!scale)continue;
        const l=mkLayer(baseName(file.name),doc.w,doc.h);placeOn(l.ctx,c,c.width,c.height,scale);touch(l);
        doc.layers.splice(doc.active+1,0,l);doc.active++;added++;
      }
      else{toast('지원하지 않는 파일이에요: '+file.name);continue}
    }catch(err){toast(file.name+': '+err.message)}
  }
  if(added){sel=null;setTool('move');commit();fitZoom();toast(`레이어 ${added}개로 합쳤어요. 이동 도구로 끌어서 위치를 맞추세요.`)}
}
// 애니메이션이 꺼져 있으면 첫 프레임만 쓰기
function firstFrameOnly(d){if(d.frames.length>1){d.frames=[d.frames[0]];for(const l of d.layers)l.cels=[l.cels[0]];d.tags=[];d.frame=0}return d}
// 다른 프로젝트를 지금 그림에 레이어로 합치기 (프레임이 여러 장이면 지금 프레임부터 이어서)
async function mergeProject(d,label){
  if(!animOn)firstFrameOnly(d);
  const scale=await askFit(label,d.w,d.h);if(!scale)return 0;
  const start=doc.frame;ensureFrames(start+d.frames.length);
  if(d.frames.length>1)d.frames.forEach((fr,i)=>{if(!dirtyFrameDur(start+i))doc.frames[start+i].duration=fr.duration});
  let n=0;
  for(const src of d.layers){
    const l=mkLayer(label+' / '+src.name,doc.w,doc.h);l.opacity=src.opacity;l.visible=src.visible;if(d.isBase||src.base)l.base=true;
    src.cels.forEach((c,i)=>{placeOn(l.cels[start+i].ctx,c.canvas,d.w,d.h,scale);touchCel(l.cels[start+i])});
    doc.layers.splice(doc.active+1,0,l);doc.active++;n++;
  }
  for(const t of d.tags)doc.tags.push({...t,from:t.from+start,to:t.to+start});
  if(d.palette){let add=false;for(const c of d.palette)if(!palette.includes(c)){palette.push(c);add=true}if(add)drawPalette()}
  return n;
}

/* ---------- GIF ---------- */
function buildPalette(frames){
  // frames: ImageData[] (1배 크기). 투명(알파<128)은 0번, 나머지 색은 최대 255개.
  let shift=0,map,cols;
  for(;shift<8;shift++){
    map=new Map();cols=[];let over=false;
    for(const im of frames){const d=im.data;for(let i=0;i<d.length;i+=4){
      if(d[i+3]<128)continue;
      const k=((d[i]>>shift)<<16)|((d[i+1]>>shift)<<8)|(d[i+2]>>shift);
      if(!map.has(k)){if(cols.length>=255){over=true;break}map.set(k,cols.length+1);cols.push(k)}
    }if(over)break}
    if(!over)break;
  }
  const half=shift?1<<(shift-1):0;
  const rgb=cols.map(k=>[Math.min(255,((k>>16)&255)<<shift|half),Math.min(255,((k>>8)&255)<<shift|half),Math.min(255,(k&255)<<shift|half)]);
  return{map,rgb,shift};
}
function lzwEncode(minCode,idx,out){
  const clear=1<<minCode,eoi=clear+1;
  let next=eoi+1,size=minCode+1,table=new Map(),cur=0,bits=0,block=[];
  const emitByte=b=>{block.push(b);if(block.length===255){out.push(255,...block);block=[]}};
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){emitByte(cur&255);cur>>>=8;bits-=8}};
  out.push(minCode);
  emit(clear);
  let prefix=idx[0];
  for(let i=1;i<idx.length;i++){
    const k=idx[i],key=prefix<<8|k,c=table.get(key);
    if(c!==undefined){prefix=c;continue}
    emit(prefix);
    if(next===4096){emit(clear);next=eoi+1;size=minCode+1;table=new Map()}
    else{if(next>=(1<<size))size++;table.set(key,next++)}
    prefix=k;
  }
  emit(prefix);emit(eoi);
  if(bits>0)emitByte(cur&255);
  if(block.length)out.push(block.length,...block);
  out.push(0);
}
function encodeGIF(seq,scale){
  const ims=[...new Set(seq)].reduce((m,f)=>{m[f]=composite(1,f).getContext('2d').getImageData(0,0,doc.w,doc.h);return m},{});
  const{map,rgb,shift}=buildPalette(Object.values(ims));
  let tb=1;while((1<<tb)<rgb.length+1)tb++;
  const W=doc.w*scale,H=doc.h*scale,out=[];
  const w16=v=>out.push(v&255,(v>>8)&255);
  for(const ch of'GIF89a')out.push(ch.charCodeAt(0));
  w16(W);w16(H);out.push(0x80|(7<<4)|(tb-1),0,0);
  for(let i=0;i<(1<<tb);i++){const c=i===0?[0,0,0]:(rgb[i-1]||[0,0,0]);out.push(...c)}
  out.push(0x21,0xFF,0x0B);for(const ch of'NETSCAPE2.0')out.push(ch.charCodeAt(0));out.push(3,1,0,0,0);
  for(const f of seq){
    const d=ims[f].data,small=new Uint8Array(doc.w*doc.h);
    for(let p=0,i=0;p<small.length;p++,i+=4){
      if(d[i+3]<128){small[p]=0;continue}
      small[p]=map.get(((d[i]>>shift)<<16)|((d[i+1]>>shift)<<8)|(d[i+2]>>shift))||0;
    }
    let idx=small;
    if(scale>1){idx=new Uint8Array(W*H);for(let y=0;y<H;y++){const sy=(y/scale|0)*doc.w,row=y*W;for(let x=0;x<W;x++)idx[row+x]=small[sy+(x/scale|0)]}}
    const delay=Math.max(2,Math.round(doc.frames[f].duration/10));
    out.push(0x21,0xF9,4,(2<<2)|1);w16(delay);out.push(0,0);
    out.push(0x2C);w16(0);w16(0);w16(W);w16(H);out.push(0);
    lzwEncode(Math.max(2,tb),idx,out);
  }
  out.push(0x3B);
  return{blob:new Blob([new Uint8Array(out)],{type:'image/gif'}),colors:rgb.length,reduced:shift>0};
}

/* ---------- 스프라이트시트 + Godot ---------- */
function gdNum(v){v=+v.toFixed(4);return Number.isInteger(v)?v+'.0':String(v)}
function gdStr(s){return String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"')}
function makeTres(sheetPath,rects,anims){
  let s=`[gd_resource type="SpriteFrames" load_steps=${rects.length+2} format=3]\n\n[ext_resource type="Texture2D" path="${gdStr(sheetPath)}" id="1_sheet"]\n\n`;
  rects.forEach((r,i)=>{s+=`[sub_resource type="AtlasTexture" id="AtlasTexture_f${i}"]\natlas = ExtResource("1_sheet")\nregion = Rect2(${r.x}, ${r.y}, ${r.w}, ${r.h})\n\n`});
  s+='[resource]\nanimations = ['+anims.map(a=>`{\n"frames": [${a.frames.map(f=>`{\n"duration": ${gdNum(f.d)},\n"texture": SubResource("AtlasTexture_f${f.i}")\n}`).join(', ')}],\n"loop": ${a.loop},\n"name": &"${gdStr(a.name)}",\n"speed": ${gdNum(a.speed)}\n}`).join(', ')+']\n';
  return s;
}
function godotAnim(name,seq,loop){
  const durs=seq.map(f=>doc.frames[f].duration),base=Math.min(...durs);
  return{name,loop,speed:1000/base,frames:seq.map(f=>({i:f,d:doc.frames[f].duration/base}))};
}

      meta:{app:'픽셀아트툴 애니',version:'2',image:png,format:'RGBA8888',size:{w:sheet.width,h:sheet.height},scale:String(scale),
        frameTags:doc.tags.map(t=>({name:t.name,from:t.from,to:t.to,direction:t.direction,color:t.color})),layers:doc.layers.map(l=>({name:l.name,opacity:Math.round(l.opacity*255),blendMode:'normal'}))}};
    files.push({name:base+'.json',blob:new Blob([JSON.stringify(json,null,1)],{type:'application/json'})});
  }
  if($('#sTres').checked){
    let pre=$('#sPath').value.trim();if(pre&&!pre.endsWith('/'))pre+='/';
    const anims=doc.tags.length?doc.tags.map(t=>godotAnim(t.name,seqFor(t.from,t.to,t.direction),t.loop!==false)):[godotAnim('default',seqFor(0,N-1,'forward'),true)];
    const names=new Set();anims.forEach(a=>{let n=a.name,k=2;while(names.has(n))n=a.name+'_'+k++;names.add(n);a.name=n});
    files.push({name:base+'.tres',blob:new Blob([makeTres(pre+png,rects,anims)],{type:'text/plain'})});
  }
  await saveFiles(files);
}

const MYBASE_KEY='pixelart-tool-my-bases',HIDDEN_KEY='pixelart-tool-hidden-bases';
function hiddenBuiltins(){try{const a=JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function setHiddenBuiltins(a){try{localStorage.setItem(HIDDEN_KEY,JSON.stringify(a));return true}catch(e){toast('지울 수 없어요');return false}}
function myBases(){try{const a=JSON.parse(localStorage.getItem(MYBASE_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function setMyBases(a){try{localStorage.setItem(MYBASE_KEY,JSON.stringify(a));return true}catch(e){toast('저장 공간이 모자라요. 마네킹을 몇 개 지우거나 .pxproj 파일로 저장해 두세요.');return false}}
async function drawBaseThumb(canvas,proj){
  try{
    const d=await parseProject(proj),f=Math.min(96/d.w,96/d.h),s=f>=1?Math.floor(f):f;
    canvas.width=Math.max(1,Math.round(d.w*s));canvas.height=Math.max(1,Math.round(d.h*s));const x=canvas.getContext('2d');x.imageSmoothingEnabled=false;
    for(const l of d.layers){if(!l.visible)continue;x.globalAlpha=l.opacity;x.drawImage(l.cels[0].canvas,0,0,canvas.width,canvas.height)}
  }catch(e){}
}

/* ---------- GitHub 동기화 (비공개 Gist, 작업마다 하나) ---------- */
const GH={token:'',login:'',ok:false,busy:false,again:false,last:0,err:'',dirty:false};
const GH_PREFIX='pxtool:',GH_FILE='work.pxproj',TOKEN_KEY='pxtool-gh-token',PXUI_TOKEN_KEY='pxui-gh-token';
try{GH.token=localStorage.getItem(TOKEN_KEY)||''}catch(e){}
let GHDEL=[];try{GHDEL=JSON.parse(localStorage.getItem('pxtool-gh-del')||'[]')}catch(e){}
function ghSaveDel(){try{localStorage.setItem('pxtool-gh-del',JSON.stringify(GHDEL))}catch(e){}}
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',body:opt.body,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401){GH.ok=false;GH.err='토큰이 맞지 않거나 만료됐어요. 새 토큰으로 다시 연결해 주세요';throw{code:'auth'}}
  if(r.status===404)throw{code:'notfound'};
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}
    if((r.status===403||r.status===429)&&(/rate limit/i.test(m)||r.headers.get('x-ratelimit-remaining')==='0')){
      const reset=+r.headers.get('x-ratelimit-reset')||0,ra=+r.headers.get('retry-after')||0;
      const when=reset?new Date(reset*1000):ra?new Date(Date.now()+ra*1000):null;
      GH.err='GitHub 요청 한도에 걸렸어요. '+(when?when.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})+' 이후에':'잠시 뒤에')+' 다시 저장해 주세요. 그림은 이 기기에 안전하게 저장돼 있어요.';
      throw{code:'rate'}}
    throw{code:'http',status:r.status,msg:m}}
  return r.status===204?null:r.json();
}
async function ghConnect(token,quiet){
  GH.token=(token||'').trim();GH.err='';if(!GH.token){GH.ok=false;return false}
  try{const u=await gh('/user');GH.login=u.login;GH.ok=true;try{localStorage.setItem(TOKEN_KEY,GH.token)}catch(e){}return true}
  catch(e){GH.ok=false;if(e.code!=='auth')GH.err=quiet?'GitHub에 연결하지 못했어요 (인터넷 확인)':'GitHub에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요';return false}
}
function ghDisconnect(){GH.ok=false;GH.token='';GH.login='';GH.err='';try{localStorage.removeItem(TOKEN_KEY)}catch(e){}renderGH();updateSavedUI()}
async function ghListAll(){const out=[];for(let page=1;page<=10;page++){const arr=await gh(`/gists?per_page=100&page=${page}`);for(const g of arr)if((g.description||'').startsWith(GH_PREFIX))out.push(g);if(arr.length<100)break}return out}
const ghPidOf=g=>(g.description||'').slice(GH_PREFIX.length).split(' ')[0];
async function ghDownload(id){
  const full=await gh('/gists/'+id),f=full.files&&full.files[GH_FILE];if(!f)throw{code:'nofile'};
  const text=f.truncated?await(await fetch(f.raw_url,{cache:'no-store'})).text():f.content;
  return{obj:JSON.parse(text),ver:full.updated_at};
}
async function ghPush(pid){
  const rec=await wGet(pid);if(!rec)return;
  const desc=`${GH_PREFIX}${pid} ${rec.name||''}`.slice(0,250);
  const content='{"pid":'+JSON.stringify(pid)+',"name":'+JSON.stringify(rec.name||'')+',"updatedAt":'+(rec.updatedAt||0)+',"thumb":'+JSON.stringify(rec.thumb||'')+',"w":'+(rec.w||0)+',"h":'+(rec.h||0)+',"frames":'+(rec.frames||1)+',"data":'+rec.json+'}';
  let res;const body=JSON.stringify({description:desc,files:{[GH_FILE]:{content}}});
  if(rec.gist){try{res=await gh('/gists/'+rec.gist,{method:'PATCH',body})}catch(e){if(e.code!=='notfound')throw e}}
  if(!res)res=await gh('/gists',{method:'POST',body:JSON.stringify({description:desc,public:false,files:{[GH_FILE]:{content}}})});
  const cur=await wGet(pid);if(!cur)return;cur.gist=res.id;cur.remoteVer=res.updated_at;if(cur.updatedAt===rec.updatedAt)cur.dirty=false;await wPut(cur);
}
function recFromRemote(obj,pid,extra){
  const json=JSON.stringify(obj.data);
  return{id:pid,name:obj.name||'제목없음',updatedAt:obj.updatedAt||Date.now(),thumb:obj.thumb||'',json,size:json.length,w:obj.w,h:obj.h,frames:obj.frames||1,...extra};
}
async function ghSync(opt={}){
  const push=!!opt.push;
  if(!GH.ok)return false;if(GH.busy){if(push)GH.again='push';else if(!GH.again)GH.again=true;return false}
  GH.lastPull=Date.now();
  await flushSave();
  GH.busy=true;GH.err='';renderGH();updateSavedUI();
  let reloadCur=false,conflicts=0,pulled=0;
  try{
    if(push)for(const id of[...GHDEL]){try{await gh('/gists/'+id,{method:'DELETE'})}catch(e){if(e.code!=='notfound')throw e}GHDEL=GHDEL.filter(x=>x!==id);ghSaveDel()}
    const remote=await ghListAll(),seen=new Set();
    for(const g of remote){
      const pid=ghPidOf(g);if(!pid||seen.has(pid))continue;seen.add(pid);
      const rec=await wGet(pid);
      if(rec&&rec.gist===g.id&&(rec.remoteVer===g.updated_at||!rec.remoteVer))continue;
      const busyHere=pid===doc.pid&&(drag||xf||modalOpen||saveT);
      if(busyHere&&!(rec&&rec.dirty))continue;             // 그리는 중이면 다음 번에 받아요
      const{obj,ver}=await ghDownload(g.id);
      if(rec&&rec.dirty){
        const np=newPid();
        await wPut(recFromRemote({...obj,name:(obj.name||'작업')+' (다른 기기 버전)'},np,{openedAt:0,dirty:true}));
        const cur=await wGet(pid);cur.gist=g.id;cur.remoteVer=ver;await wPut(cur);conflicts++;continue;
      }
      await wPut(recFromRemote(obj,pid,{openedAt:rec?rec.openedAt||0:0,gist:g.id,remoteVer:ver,dirty:false}));
      pulled++;if(pid===doc.pid)reloadCur=true;
    }
    for(const rec of await wAll()){
      if(rec.gist&&!seen.has(rec.id)&&rec.remoteVer){
        if(!rec.dirty){await wDel(rec.id);if(rec.id===doc.pid)reloadCur='gone';continue}
        rec.gist=null;rec.remoteVer=null;await wPut(rec);
      }
    }
    if(push){for(const rec of await wAll())if(rec.dirty)await ghPush(rec.id);GH.last=Date.now()}
    GH.dirty=GHDEL.length>0||(await wAll()).some(r=>r.dirty);
  }catch(e){if(e&&e.code!=='auth'&&e.code!=='rate')GH.err=e&&e.code==='http'?`GitHub 오류 (${e.status}${e.msg?' · '+e.msg:''})`:'동기화하지 못했어요. 인터넷 연결을 확인해 주세요'}
  finally{GH.busy=false}
  if(reloadCur==='gone'){const rest=(await wAll()).sort((a,b)=>(b.openedAt||0)-(a.openedAt||0));doc.pid=null;if(rest.length)await openWork(rest[0].id,true);else newDoc(32,32);toast('다른 기기에서 지운 작업이라 다른 작업을 열었어요')}
  else if(reloadCur){const z=zoom,sl=stage.scrollLeft,st=stage.scrollTop,f=doc.frame,a=doc.active;const rec=await wGet(doc.pid);const d=await parseProject(JSON.parse(rec.json));d.pid=rec.id;d.name=rec.name;
    if(f<d.frames.length)d.frame=f;if(a<d.layers.length)d.active=a;setDoc(d);if(d.w===doc.w)setZoomRaw(z,sl,st);toast('다른 기기에서 고친 내용을 불러왔어요')}
  if(conflicts)toast('두 기기에서 동시에 고친 작업이 있어서 "(다른 기기 버전)"으로 따로 저장해 뒀어요');
  renderGH();updateSavedUI();
  if(GH.again){const p=GH.again==='push';GH.again=false;setTimeout(()=>ghSync({push:p}),500)}
  return !GH.err;
}
function setZoomRaw(z,sl,st){zoom=z;draw();refreshAll();stage.scrollLeft=sl;stage.scrollTop=st}
// GitHub에 올리는 건 ☁ 저장(⌘S)을 눌렀을 때만. 받아오는 건 열 때·앱으로 돌아올 때·내 작업을 열 때 (요청 수를 아끼려고)

function renderGH(){
  const box=$('#ghBox');if(!box)return;
  let pxui='';try{pxui=localStorage.getItem(PXUI_TOKEN_KEY)||''}catch(e){}
  if(GH.ok){

/* ---------- iPad: 손가락으로 화면 옮기기·확대, 두 손가락 탭 = 실행취소 ---------- */
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let fingerDraw=false;
const touches=new Map();let gest=null;
function tMid(){const a=[...touches.values()];return{x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length}}
function tDist(){const a=[...touches.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function gestBase(){gest=Object.assign(gest||{t0:Date.now(),n:0,moved:false},{z0:zoom,d0:tDist(),last:tMid()});gest.n=Math.max(gest.n,touches.size)}
stage.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch'||modalOpen)return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(fingerDraw&&touches.size===1&&!gest)return;            // 손가락으로 그리기
  e.stopImmediatePropagation();e.preventDefault();
  capture(stage,e)
  if(drag){                                                // 그리던 중 두 번째 손가락 → 그리던 것 취소
    const d=drag;drag=null;if(hist[hi])restore(hist[hi]);
  }
  if(xfDrag)xfDrag=null;
  gestBase();
},{capture:true});
stage.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!touches.has(e.pointerId))return;
  touches.get(e.pointerId).x=e.clientX;touches.get(e.pointerId).y=e.clientY;
  if(!gest)return;
  e.stopImmediatePropagation();
  const m=tMid();
  if(Math.hypot(m.x-gest.last.x,m.y-gest.last.y)>2||(touches.size>1&&Math.abs(tDist()-gest.d0)>8))gest.moved=true;
  if(!gest.moved)return;
  if(touches.size>=2&&gest.d0>0){const z=gest.z0*tDist()/gest.d0;if(Math.round(z)!==zoom)setZoom(z,m.x,m.y)}
  stage.scrollLeft-=m.x-gest.last.x;stage.scrollTop-=m.y-gest.last.y;gest.last=m;
},{capture:true});
function touchEnd(e){
  if(e.pointerType!=='touch'||!touches.has(e.pointerId))return;
  touches.delete(e.pointerId);
  if(!gest)return;
  e.stopImmediatePropagation();
  if(touches.size===0){
    if(!gest.moved&&Date.now()-gest.t0<350){if(gest.n===2){undo();toast('실행취소')}else if(gest.n===3){redo();toast('다시실행')}}
    gest=null;
  }else gestBase();
}
stage.addEventListener('pointerup',touchEnd,{capture:true});
stage.addEventListener('pointercancel',touchEnd,{capture:true});
document.addEventListener('gesturestart',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(modalOpen)return;
  const tag=e.target.tagName,typing=tag==='INPUT'&&(e.target.type==='text'||e.target.type==='number');
  const mod=e.metaKey||e.ctrlKey;
  if(xf&&!typing&&e.key==='Enter'){e.preventDefault();applyXf();return}
  if(xf&&e.key==='Escape'&&!typing){e.preventDefault();cancelXf();return}
  if(mod&&e.key==="'"){e.preventDefault();grid.tile=grid.tile==='none'?(grid.last||'square'):'none';gridChanged();toast(grid.tile==='none'?'타일 격자 끔':'타일 격자 켬');return}
  if(mod&&e.code==='KeyS'){e.preventDefault();e.shiftKey?saveAs():cloudSave();return}
  if(typing||tag==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();spaceDown=true;stage.classList.add('pan');return}
  if(mod){
    const m={KeyZ:()=>e.shiftKey?redo():undo(),KeyY:redo,KeyO:openDialog,KeyC:()=>copySel(),KeyX:cutSel,KeyV:pasteClip,KeyA:()=>{sel={x:0,y:0,w:doc.w,h:doc.h};render()},KeyD:()=>{sel=null;render()}}[e.code];
    if(m){e.preventDefault();if(!drag)m()}
    return;
  }
  if(drag)return;
  if(e.shiftKey&&e.code==='KeyT'){setAnim(!animOn);return}
  if(e.shiftKey&&e.code==='KeyB'){basesDialog();return}
  if(animOn&&e.key==='Enter'){e.preventDefault();if(document.activeElement&&document.activeElement.tagName==='BUTTON')document.activeElement.blur();togglePlay();return}
  if(animOn&&e.code==='KeyN'){e.preventDefault();addFrame(!e.shiftKey);return}
  if(animOn&&e.code==='KeyK'){onion.on=!onion.on;$('#onion').checked=onion.on;saveSettings();render();toast('어니언 스킨 '+(onion.on?'켬':'끔'));return}
  if(animOn&&(e.key===','||e.key==='<')){$('#bPrev').click();return}
  if(animOn&&(e.key==='.'||e.key==='>')){$('#bNext').click();return}
  if(animOn&&e.key==='Home'){e.preventDefault();gotoFrame(0);return}
  if(animOn&&e.key==='End'){e.preventDefault();gotoFrame(nF()-1);return}
  const t=!e.shiftKey&&TOOLS.find(x=>x[3]===e.code);
  if(t){setTool(t[0]);if(t[0]==='transform'&&!xf)startXf();return}
  const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(arrows){e.preventDefault();stopPlay();if(xf){xf.cx+=arrows[0];xf.cy+=arrows[1];xfUpdate();return}nudge(...arrows);return}
  switch(e.key){
    case'[':brush=Math.max(1,brush-1);$('#brush').value=brush;$('#brushv').textContent=brush;render();break;
    case']':brush=Math.min(16,brush+1);$('#brush').value=brush;$('#brushv').textContent=brush;render();break;
    case'Escape':sel=null;render();break;
    case'Delete':case'Backspace':if(sel){e.preventDefault();clearSel()}break;
    case'+':case'=':$('#zIn').click();break;
    case'-':case'_':$('#zOut').click();break;
    case'0':fitZoom();break;
  }
});

async function checkUpdate(){
  if(!/^https?:/.test(location.protocol))return;
  try{
    const t=await(await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){const b=$('#bUpdate');b.hidden=false;b.onclick=async()=>{await flushSave();location.replace(location.pathname+'?v='+encodeURIComponent(m[1]))}}
  }catch(e){}
}

  let opened=false;
  try{
    const all=await wAll();
    if(all.length){let last='';try{last=localStorage.getItem(LAST_KEY)||''}catch(e){}
      const pick=all.find(r=>r.id===last)||all.sort((a,b)=>(b.openedAt||0)-(a.openedAt||0))[0];opened=await openWork(pick.id,true)}
    else if(await migrateAutosave()){opened=true;toast('지난번에 하던 작업을 내 작업으로 옮겨서 열었어요')}
  }catch(e){toast('이 브라우저에 저장 공간을 쓸 수 없어서 자동 저장이 안 돼요')}
  if(!opened)newDoc(32,32);
  if(TOUCH){$('#fingerRow').hidden=false;$('#fingerDraw').checked=fingerDraw}
  ghInit();
  $('#ver').textContent='v'+APP_VERSION;
  checkUpdate();setInterval(checkUpdate,10*60*1000);
})();
</script>
</body>
